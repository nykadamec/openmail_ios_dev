<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Settings + Contacts Sketch — modern minimal</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <style>
    :root {
      --bg: #0B0B0F;
      --surface: #141419;
      --surface-hover: #1C1C22;
      --border: rgba(255,255,255,0.08);
      --text: #F2F2F7;
      --text-secondary: #8E8E93;
      --text-tertiary: #636366;
      --accent: #3B82F6;
      --accent-subtle: rgba(59,130,246,0.12);
      --error: #FF453A;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    /* Panel chrome */
    .panel-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .panel-top h1 {
      font-size: 20px; font-weight: 700;
      flex: 1;
    }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn i { font-size: 20px; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px calc(var(--safe-bottom) + 16px);
    }

    /* Sections */
    .section {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin: 24px 0 10px 12px;
    }

    /* List rows */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .row:first-child { border-radius: 16px 16px 0 0; }
    .row:last-child { border-radius: 0 0 16px 16px; border-bottom: 1px solid var(--border); }
    .row:only-child { border-radius: 16px; border-bottom: 1px solid var(--border); }
    .row .left {
      display: flex; align-items: center; gap: 12px;
    }
    .row .left i { font-size: 20px; color: var(--text-secondary); }
    .row .label { font-size: 15px; font-weight: 500; }
    .row .value { font-size: 14px; color: var(--text-secondary); }

    /* Contact item */
    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .contact:last-child { border-bottom: none; }
    .contact .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #2C2C2E;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 15px;
      flex-shrink: 0;
    }
    .contact .info { flex: 1; min-width: 0; }
    .contact .name { font-size: 15px; font-weight: 600; }
    .contact .email { font-size: 13px; color: var(--text-secondary); }
    .contact .trash {
      width: 34px; height: 34px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .contact .trash i { font-size: 18px; }

    /* Search */
    .search {
      margin: 12px 0 16px;
    }
    .search input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search input::placeholder { color: var(--text-tertiary); }

    /* Buttons */
    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .secondary-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px; font-weight: 600;
      cursor: pointer;
    }

    /* Language switch */
    .lang-switch {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .lang-switch button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .lang-switch button.active {
      background: var(--accent-subtle);
      color: var(--accent);
      border-color: rgba(59,130,246,0.25);
    }

    .danger {
      color: var(--error) !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel-top">
      <button class="icon-btn" aria-label="Back">
        <i class="hgi-stroke hgi-arrow-left-01" aria-hidden="true"></i>
      </button>
      <h1>Settings</h1>
    </div>

    <div class="panel-body">
      <div class="section-title">Account</div>
      <div class="section">
        <div class="row">
          <div class="left">
            <i class="hgi-stroke hgi-user" aria-hidden="true"></i>
            <span class="label">Username</span>
          </div>
          <span class="value">@dominik</span>
        </div>
        <div class="row">
          <div class="left">
            <i class="hgi-stroke hgi-mail-01" aria-hidden="true"></i>
            <span class="label">Email</span>
          </div>
          <span class="value"> dominik@openmail.local</span>
        </div>
      </div>

      <div class="section-title">Preferences</div>
      <div class="section">
        <div class="row">
          <div class="left">
            <i class="hgi-stroke hgi-translate" aria-hidden="true"></i>
            <span class="label">Language</span>
          </div>
        </div>
        <div class="lang-switch">
          <button class="active">English</button>
          <button>Čeština</button>
        </div>
      </div>

      <div class="section-title">Data</div>
      <div class="section">
        <button class="secondary-btn">
          <i class="hgi-stroke hgi-refresh" aria-hidden="true"></i> Clear cache
        </button>
      </div>

      <div class="section-title">Session</div>
      <div class="section">
        <button class="secondary-btn danger">
          <i class="hgi-stroke hgi-logout-01" aria-hidden="true"></i> Log out
        </button>
      </div>

      <!-- Contacts preview below settings -->
      <div class="section-title">Contacts</div>
      <button class="primary-btn">+ Add contact</button>
      <div class="search">
        <input type="text" placeholder="Search contacts">
      </div>

      <div class="section">
        <div class="contact">
          <div class="avatar">A</div>
          <div class="info">
            <div class="name">Alice Smith</div>
            <div class="email">alice@example.com</div>
          </div>
          <button class="trash">
            <i class="hgi-stroke hgi-delete-01" aria-hidden="true"></i>
          </button>
        </div>
        <div class="contact">
          <div class="avatar">M</div>
          <div class="info">
            <div class="name">Martin Novák</div>
            <div class="email">martin@example.com</div>
          </div>
          <button class="trash">
            <i class="hgi-stroke hgi-delete-01" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
