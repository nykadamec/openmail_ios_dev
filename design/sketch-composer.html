<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Composer Sketch — modern minimal</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <style>
    :root {
      --bg: #0B0B0F;
      --surface: #141419;
      --surface-hover: #1C1C22;
      --border: rgba(255,255,255,0.08);
      --text: #F2F2F7;
      --text-secondary: #8E8E93;
      --text-tertiary: #636366;
      --accent: #3B82F6;
      --accent-subtle: rgba(59,130,246,0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .top h1 { font-size: 18px; font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .text-btn {
      background: none; border: none;
      color: var(--text-secondary);
      font-size: 15px; font-weight: 600;
      cursor: pointer; padding: 8px;
    }
    .text-btn.primary {
      background: var(--accent); color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* Form */
    .form {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px calc(var(--safe-bottom) + 16px);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-of-type { border-bottom: none; }
    .row .label {
      font-size: 14px; font-weight: 600;
      color: var(--text-secondary);
      flex-shrink: 0;
      width: 56px;
    }
    .row input, .row .chip {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    .row input::placeholder { color: var(--text-tertiary); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-subtle);
      color: var(--accent);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 14px; font-weight: 600;
    }
    .chip i { font-size: 14px; }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 220px;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.6;
      padding: 16px 0;
      outline: none;
      resize: none;
    }
    textarea::placeholder { color: var(--text-tertiary); }

    .composer-actions {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn i { font-size: 19px; }

    .attachments-preview {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 8px 0;
    }
    .attachment-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
    }
    .attachment-chip i { font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <button class="text-btn">Cancel</button>
      <h1>New message</h1>
      <div class="top-actions">
        <button class="text-btn primary">Send</button>
      </div>
    </div>

    <div class="form">
      <div class="row">
        <span class="label">To</span>
        <span class="chip">
          Alice Smith
          <i class="hgi-stroke hgi-cancel-01" aria-hidden="true"></i>
        </span>
        <input type="email" placeholder="">
      </div>

      <div class="row">
        <span class="label">Subject</span>
        <input type="text" placeholder="Subject" value="Re: Project update">
      </div>

      <textarea placeholder="Write your message...">Hi Alice, thanks for the update. I’ll review the Figma files today and share feedback by tomorrow morning.

Best,
Dominik</textarea>

      <div class="attachments-preview">
        <span class="attachment-chip">
          <i class="hgi-stroke hgi-attachment-01" aria-hidden="true"></i>
          notes.pdf (120 KB)
        </span>
      </div>

      <div class="composer-actions">
        <button class="icon-btn" aria-label="Attach">
          <i class="hgi-stroke hgi-attachment-01" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
