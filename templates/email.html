<!DOCTYPE html>
<html lang="cs" class="email-detail-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{ email.subject or 'E-mail' }}</title>
  <link rel="preconnect" href="https://use.hugeicons.com">
  <link rel="preconnect" href="https://ico.hugeicons.com">
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <script data-cfasync="false">
    window.__OPENMAIL_FROM_EMAIL = {{ from_email | tojson }};
    window.__OPENMAIL_EMAIL_ID = {{ email.id }};
  </script>
</head>
<body class="email-detail-page">
  <div id="app">
    <div class="header reader-header">
      <div class="header-content">
        <button class="icon-btn" id="backBtn" aria-label="Zpět">
          <i class="hgi-stroke hgi-arrow-left-01" aria-hidden="true"></i>
        </button>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="readerStarBtn" aria-label="Hvězda">
          <i class="hgi-stroke hgi-star" aria-hidden="true"></i>
        </button>
        <button class="icon-btn html-toggle" id="htmlToggle" aria-label="Přepnout HTML" style="display:none">
          <i class="hgi-stroke hgi-code" aria-hidden="true"></i>
        </button>
        <button class="icon-btn" id="trashBtn" aria-label="Koš">
          <i class="hgi-stroke hgi-delete-01" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="email-detail-content" id="emailDetailContent">
      <div class="reader-scroll">
        <h2 id="rSubject">{{ email.subject or 'Bez předmětu' }}</h2>
        <div class="meta-block" id="rMetaBlock">
          <div class="avatar" id="senderAvatar">?</div>
          <div class="info">
            <div class="from" id="rFrom">-</div>
            <div class="to" id="rTo">-</div>
          </div>
          <div class="time" id="rTime">-</div>
        </div>
        <div class="body" id="rBody"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/static/js/email.js?v=1"></script>
</body>
</html>
