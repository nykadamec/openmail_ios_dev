<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Adamec.pro Mail</title>
  <link rel="stylesheet" href="/static/liquid-glass.css">
</head>
<body>
  <!-- Floating warm orbs for atmospheric depth -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <div class="brand-tag">Adamec.pro Mail</div>
        <h1 id="headerTitle">Inbox</h1>
        <div class="subtitle" id="headerSubtitle">Synchronizace…</div>
      </div>
    </div>

    <!-- Email List -->
    <div class="content" id="content">
      <div id="emailList"></div>
    </div>

    <!-- Floating Tab Bar — "Midnight Forge" style -->
    <div class="tab-bar-wrap">
      <nav class="tab-bar" id="tabBar">
        <div class="bar-fill"></div>
        <div class="active-glow" id="activeGlow"></div>
        <button class="tab" data-folder="inbox" onclick="setFolder('inbox')">
          <span class="icon">📥</span>
          <span class="count" id="tabInboxCount"></span>
        </button>
        <button class="tab" data-folder="starred" onclick="setFolder('starred')">
          <span class="icon">⭐</span>
        </button>
        <button class="tab compose" onclick="openComposer()">
          <span class="icon">✏️</span>
        </button>
        <button class="tab" data-folder="sent" onclick="setFolder('sent')">
          <span class="icon">📤</span>
        </button>
        <button class="tab" onclick="syncEmails()">
          <span class="icon">🔄</span>
        </button>
      </nav>
    </div>

    <!-- Reader -->
    <div class="reader" id="reader">
      <div class="reader-top">
        <button onclick="closeReader()">←</button>
        <div class="spacer"></div>
        <button class="star-btn" id="readerStarBtn" onclick="toggleStarFromReader()">☆</button>
      </div>
      <div class="reader-scroll">
        <h2 id="rSubject"></h2>
        <div class="meta-block" id="rMetaBlock"></div>
        <div class="body" id="rBody"></div>
      </div>
    </div>

    <!-- Composer -->
    <div class="composer" id="composer">
      <div class="composer-top">
        <button onclick="closeComposer()">Zrušit</button>
        <div class="spacer"></div>
        <button class="send-btn" onclick="sendEmail()">Odeslat</button>
      </div>
      <div class="form">
        <div class="field">
          <span class="prefix">Komu</span>
          <input type="email" id="toField" placeholder="email@example.com" autocomplete="email">
        </div>
        <div class="field">
          <span class="prefix">Předmět</span>
          <input type="text" id="subjectField" placeholder="Předmět">
        </div>
        <textarea id="bodyField" placeholder="Napište zprávu..."></textarea>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script>
    // ---- State ----
    let currentFolder = 'inbox';
    let currentEmailId = null;
    let currentEmails = [];
    let currentEmailData = null;
    const FROM_EMAIL = '{{ from_email }}';

    // ---- DOM refs ----
    const listEl = document.getElementById('emailList');
    const readerEl = document.getElementById('reader');
    const composerEl = document.getElementById('composer');
    const toastEl = document.getElementById('toast');
    const tabBar = document.getElementById('tabBar');
    const activeGlow = document.getElementById('activeGlow');

    // ---- Avatar colors (warm theme) ----
    const AVATAR_COLORS = [
      'linear-gradient(135deg, #ff6b35, #c8431f)',
      'linear-gradient(135deg, #ff9558, #ff6b35)',
      'linear-gradient(135deg, #4a90e2, #5e5ce6)',
      'linear-gradient(135deg, #ffb088, #ff6b35)',
      'linear-gradient(135deg, #e8b4b8, #c8431f)',
      'linear-gradient(135deg, #5e5ce6, #4a90e2)',
      'linear-gradient(135deg, #ff9f0a, #ff6b35)',
      'linear-gradient(135deg, #ff375f, #ff6b35)',
    ];
    function avatarColor(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h << 5) - h + seed.charCodeAt(i);
      return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
    }
    function initial(text) {
      if (!text) return '?';
      const c = text.replace(/[^a-zA-Z0-9]/g, '');
      return (c[0] || text[0] || '?').toUpperCase();
    }

    // ---- SSE ----
    function connectSSE() {
      const evt = new EventSource('/api/events');
      evt.addEventListener('new_email', (e) => {
        try {
          const data = JSON.parse(e.data);
          showToast('📬 ' + (data.subject || 'Nový e-mail'));
          loadEmails();
          loadStats();
        } catch {}
      });
      evt.onerror = () => setTimeout(connectSSE, 3000);
    }

    // ---- Toast ----
    let toastTimer = null;
    function showToast(msg, type = 'success') {
      toastEl.textContent = msg;
      toastEl.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.className = 'toast', 2500);
    }

    // ---- Active tab glow positioning ----
    function positionActiveGlow(activeTab) {
      if (!activeTab || !activeGlow) return;
      const tabBarRect = tabBar.getBoundingClientRect();
      const tabRect = activeTab.getBoundingClientRect();
      const x = tabRect.left - tabBarRect.left + (tabRect.width - 52) / 2;
      activeGlow.style.transform = `translateX(${x}px)`;
    }

    // ---- Navigation ----
    function setFolder(folder) {
      currentFolder = folder;
      document.querySelectorAll('.tab-bar .tab').forEach(el => el.classList.remove('active'));
      const active = document.querySelector(`.tab-bar .tab[data-folder="${folder}"]`);
      if (active) {
        active.classList.add('active');
        positionActiveGlow(active);
      }
      const titles = { inbox: 'Inbox', sent: 'Odeslané', starred: 'Hvězdy' };
      document.getElementById('headerTitle').textContent = titles[folder] || folder;
      loadEmails();
    }

    function closeReader() {
      readerEl.classList.remove('open');
      currentEmailId = null;
      currentEmailData = null;
    }
    function openComposer() { composerEl.classList.add('open'); }
    function closeComposer() {
      composerEl.classList.remove('open');
      document.getElementById('toField').value = '';
      document.getElementById('subjectField').value = '';
      document.getElementById('bodyField').value = '';
    }

    // ---- Load emails ----
    async function loadEmails() {
      let url;
      if (currentFolder === 'starred') {
        url = '/api/emails?starred=1&direction=inbound';
      } else {
        url = `/api/emails?folder=${currentFolder}&direction=${currentFolder === 'sent' ? 'outbound' : 'inbound'}`;
      }
      listEl.innerHTML = '<div class="loading"><div class="spinner"></div>Načítání</div>';
      try {
        const res = await fetch(url);
        const emails = await res.json();
        if (!res.ok) throw new Error(emails.error || 'Chyba');
        currentEmails = emails;
        if (emails.length === 0) {
          listEl.innerHTML = '<div class="empty">Žádné e-maily</div>';
          return;
        }
        listEl.innerHTML = emails.map((e, i) => {
          const isSent = currentFolder === 'sent';
          const identifier = isSent ? (e.recipient || '') : (e.sender_email || e.sender_name || '?');
          const fromLabel = isSent ? (e.recipient || 'Neznámý') : (e.sender_name || e.sender_email || 'Neznámý');
          return `
            <div class="email-card ${e.is_read ? '' : 'unread'} ${e.is_starred ? 'starred' : ''}" style="animation-delay: ${i * 0.04}s" onclick="openEmail(${e.id})">
              <div class="card-fill"></div>
              <div class="card-glow"></div>
              ${e.is_starred ? '<span class="star">★</span>' : ''}
              <div class="content-row">
                <div class="avatar" style="background: ${avatarColor(identifier)}">${escapeHtml(initial(identifier))}</div>
                <div class="body">
                  <div class="meta-row">
                    <div class="from-name">${escapeHtml(fromLabel)}</div>
                    <div class="time">${formatDate(e.created_at)}</div>
                  </div>
                  <div class="subject">${escapeHtml(e.subject || '(bez předmětu)')}</div>
                  <div class="preview">${escapeHtml(e.preview || '')}</div>
                </div>
                ${!e.is_read ? '<div class="unread-dot"></div>' : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listEl.innerHTML = `<div class="empty">Chyba: ${escapeHtml(err.message)}</div>`;
      }
    }

    // ---- Open email ----
    async function openEmail(id) {
      try {
        const res = await fetch(`/api/emails/${id}`);
        const e = await res.json();
        if (!res.ok) throw new Error(e.error || 'Chyba');
        currentEmailId = id;
        currentEmailData = e;
        document.getElementById('rSubject').textContent = e.subject || '(bez předmětu)';
        const isSent = currentFolder === 'sent';
        const identifier = isSent ? (e.recipient || '') : (e.sender_email || e.sender_name || '?');
        const from = e.sender_name || e.sender_email || 'Neznámý';
        const fromEmail = e.sender_email ? `<${e.sender_email}>` : '';
        const metaBlock = document.getElementById('rMetaBlock');
        metaBlock.innerHTML = `
          <div class="avatar" style="background: ${avatarColor(identifier)}">${escapeHtml(initial(identifier))}</div>
          <div class="info">
            <div class="from">${escapeHtml(isSent ? e.recipient : from)}</div>
            <div class="to">${escapeHtml(isSent ? 'Od: ' + FROM_EMAIL : fromEmail)}</div>
          </div>
          <div class="time">${formatFullDate(e.created_at)}</div>
        `;
        document.getElementById('rBody').textContent = e.body_text || stripHtml(e.body_html) || '(prázdná zpráva)';
        document.getElementById('readerStarBtn').textContent = e.is_starred ? '★' : '☆';
        document.getElementById('readerStarBtn').classList.toggle('active', e.is_starred);
        readerEl.classList.add('open');
        loadEmails();
        loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ---- Star toggle ----
    async function toggleStarFromReader() {
      if (!currentEmailId) return;
      const current = currentEmails.find(e => e.id === currentEmailId);
      const newStar = current ? (current.is_starred ? 0 : 1) : 1;
      try {
        await fetch(`/api/emails/${currentEmailId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_starred: newStar })
        });
        const btn = document.getElementById('readerStarBtn');
        btn.textContent = newStar ? '★' : '☆';
        btn.classList.toggle('active', !!newStar);
        showToast(newStar ? '★ Přidána hvězdička' : '☆ Odebrána');
        loadEmails();
        loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ---- Send email ----
    async function sendEmail() {
      const payload = {
        to: document.getElementById('toField').value,
        subject: document.getElementById('subjectField').value,
        body: document.getElementById('bodyField').value
      };
      if (!payload.to || !payload.subject) {
        showToast('Vyplňte příjemce a předmět', 'error');
        return;
      }
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Chyba');
        showToast('✓ Odesláno');
        closeComposer();
        loadEmails();
        loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function syncEmails() {
      showToast('🔄 Synchronizuji...');
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Chyba');
        showToast(`✓ Načteno ${data.imported} e-mailů`);
        loadEmails();
        loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const s = await res.json();
        document.getElementById('headerSubtitle').textContent =
          s.unread ? `${s.unread} nepřečtených · ${s.inbound} celkem` : `${s.inbound} celkem`;
        document.getElementById('tabInboxCount').textContent = s.unread || '';
      } catch (e) {}
    }

    // ---- Helpers ----
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function stripHtml(html) {
      if (!html) return '';
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      const now = new Date();
      const diff = now - d;
      if (diff < 86400000) return d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
      if (diff < 604800000) return d.toLocaleDateString('cs-CZ', { weekday: 'short' });
      return d.toLocaleDateString('cs-CZ', { day: '2-digit', month: '2-digit' });
    }
    function formatFullDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleString('cs-CZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // ---- Init ----
    document.addEventListener('DOMContentLoaded', () => {
      loadEmails();
      loadStats();
      connectSSE();
      setFolder('inbox');
    });
  </script>
</body>
</html>
