<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0B0F">
  <title>{{ _("login.title") }}</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body class="auth-body">
  <form class="auth-card" method="post">
    <div class="auth-brand">
      <div class="logo">
        <i class="hgi-stroke hgi-mail-01" aria-hidden="true"></i>
      </div>
      <h1>{{ _("login.heading") }}</h1>
      <p>{{ _("login.welcome") }}</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <div class="field">
      <label>{{ _("login.username") }}</label>
      <input type="text" name="username" autofocus required>
    </div>
    <div class="field">
      <label>{{ _("login.password") }}</label>
      <input type="password" name="password" required>
    </div>

    <button type="submit" class="primary-btn">{{ _("login.submit") }}</button>

    <div class="auth-footer">{{ _("login.footer") }}</div>
  </form>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
